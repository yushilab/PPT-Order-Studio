name: portable-workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[extract,dev]"
      - run: python -m pytest -q
      - run: python -m pptstudio doctor --json
      - run: python -m pptstudio demo orders/ci-demo
      - run: python -m build
