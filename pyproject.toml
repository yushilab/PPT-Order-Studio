[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-order-studio"
version = "0.1.0"
description = "Local-first, AI-assisted PowerPoint order workflow with evidence, approvals and bounded context."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PPT Order Studio contributors"}]
dependencies = ["python-pptx>=1.0.2,<2", "Pillow>=10,<13"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
extract = ["python-docx>=1.1,<2", "openpyxl>=3.1,<4", "pypdf>=5,<7"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
pptstudio = "pptstudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pptstudio = ["data/*.json", "data/*.md", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
